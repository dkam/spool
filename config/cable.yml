# solid_cable rather than async in development, and not for fidelity's sake:
# the broadcasts that matter here originate in bin/worker (a mail arriving is
# an ingest-consumer write), and the async adapter only reaches subscribers in
# its own process — every worker-side broadcast would silently vanish.
development:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day

test:
  adapter: test

production:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day
