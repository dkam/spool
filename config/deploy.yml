# Kamal deployment for Spool. See docs/deploy.md.
#
# One image, four containers on one host: web, worker, scheduler, and the tuber
# accessory. The three app roles run the same image with a different command —
# `bin/docker-entrypoint` runs `db:prepare` only for the web process, so the
# worker and scheduler can never race it to migrate.
#
# Every `example.com` below is a placeholder. Nothing here is secret; the
# secrets are named in `.kamal/secrets` and fetched from your password manager.

service: spool
image: dkam/spool

# Roles. `web` is the primary and the only one behind the proxy.
servers:
  web:
    - 192.168.0.1
  worker:
    hosts:
      - 192.168.0.1
    cmd: bin/worker all
    proxy: false
  scheduler:
    hosts:
      - 192.168.0.1
    cmd: bin/scheduler
    proxy: false

# kamal-proxy terminates TLS and gets the certificate from Let's Encrypt.
# This is why `config.assume_ssl` and `config.force_ssl` are on in
# config/environments/production.rb — turning the proxy off here means turning
# those off too, or every request redirects to a scheme nothing is listening on.
proxy:
  ssl: true
  host: spool.example.com

# The same registry the release workflow publishes to (ghcr.io/dkam/spool), so
# a Kamal deploy and a released image are the same repository, distinguished by
# tag: Kamal pushes the git SHA, .github/workflows/build.yml pushes vX.Y.Z.
registry:
  server: ghcr.io
  username: dkam
  password:
    - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - RAILS_MASTER_KEY
    - OIDC_CLIENT_SECRET
  clear:
    # Host authority for absolute URLs — a hostname or "host:port", never a URI.
    SPOOL_HOST: spool.example.com

    # The support address. Shown in the header, and the From: on outbound mail.
    SPOOL_MAILBOX: support@example.com

    # Domain used in generated Message-IDs. Defaults to SPOOL_HOST's domain;
    # set it when the two differ.
    # SPOOL_MESSAGE_ID_DOMAIN: example.com

    # The tuber accessory, reachable by container name on the Kamal network.
    TUBER_URL: spool-tuber:11300

    # OIDC. All three of client id, client secret and discovery URL must be set
    # or the app refuses to boot in production — see docs/auth.md. The secret is
    # in the `secret:` list above.
    OIDC_DISCOVERY_URL: https://id.example.com/.well-known/openid-configuration
    OIDC_CLIENT_ID: spool
    OIDC_PROVIDER_NAME: Example ID

    # Who may sign in. At least one of these must be non-empty, or boot fails:
    # an empty allowlist denies everyone after a successful round trip to the
    # provider, which is the hardest failure to diagnose from the outside.
    # Domains match subdomains, and accept a leading "*.".
    SPOOL_ALLOWED_DOMAINS: example.com
    # SPOOL_ALLOWED_USERS: alice@example.com,bob@example.com

    # Puma. One process is right at this scale; threads are the SQLite writer
    # pool size as well — see docs/architecture.md.
    # WEB_CONCURRENCY: 1
    # RAILS_MAX_THREADS: 5

    # Log everything from Rails
    # RAILS_LOG_LEVEL: debug

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r worker" will tail logs from the first server in the worker section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"

# The primary SQLite file is the entire application state — messages,
# attachment bytes, dictionaries, sessions. This volume is the whole backup
# surface, and the only thing on the host worth keeping.
volumes:
  - "spool_storage:/rails/storage"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
asset_path: /rails/public/assets

# Configure the image builder.
#
# GIT_SHA is what config/initializers/revision.rb reports at runtime, so
# "is what I built actually running?" has an answer. Kamal builds from the
# working tree, so this reads the working tree's HEAD.
builder:
  arch: amd64
  args:
    GIT_SHA: <%= `git rev-parse HEAD`.strip %>

  # # Build image via remote server (useful for faster amd64 builds on arm64 computers)
  # remote: ssh://docker@docker-builder-server

# Use a different ssh user than root
# ssh:
#   user: app

# Tuber, the job queue (docs/queue.md). No `port:` — the app reaches it over
# the Kamal docker network, and nothing outside the host should.
#
# Persistence is not optional here: the inbound tube carries email that has
# been accepted and not yet turned into a ticket, so an in-memory queue loses
# customer mail on restart. TUBER_BINLOG_DIR turns the WAL on, and tuber
# refuses to start with persistence enabled and no disk budget.
accessories:
  tuber:
    image: ghcr.io/tuberq/tuber:latest
    host: 192.168.0.1
    cmd: server
    env:
      clear:
        TUBER_BINLOG_DIR: /var/lib/tuber
        TUBER_MAX_STORAGE_BYTES: 2g
    directories:
      - data:/var/lib/tuber
