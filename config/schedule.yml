# Recurring jobs, read by bin/scheduler. Each entry pushes
#   { "class": "<class name>", "args": [] }
# onto the named tube on the given schedule; Ingest::DispatchConsumer drains
# spool.maintenance and calls #perform on the named class.
#
# schedule: rufus syntax — "every Xs/Xm/Xh" or "cron <expr>".
# con:      tuber concurrency key — caps simultaneous reserves across all
#           consumers for jobs sharing the key.
# idp:      tuber idempotency key — while a job with this key is in the tube
#           (ready or reserved), further puts with it are suppressed. Use on
#           anything that can run longer than its own interval.
#
# See docs/queue.md.

# Poll the IMAP folder for new support mail. idp: because a slow round trip
# must not stack a second poller behind the first — two pollers fetching the
# same UIDs is how you get duplicate work (harmless, thanks to the unique index
# on messages.message_id, but pointless).
#
# Milestone 3. Commented until Imap::PollJob exists; see docs/todo.md.
# imap_poll:
#   class: Imap::PollJob
#   tube: spool.maintenance
#   schedule: every 60s
#   idp: imap_poll

# Sweep OIDC session mappings whose expiry has passed. Cheap: one indexed
# delete over a table that holds at most a handful of rows.
cleanup_expired_oidc_sessions:
  class: CleanupExpiredOidcSessionsJob
  tube: spool.maintenance
  schedule: cron 17 * * * *
  con: 1
