# Recurring jobs. Each worker syncs this whole file to tuber at boot (see
# Ingest::Schedule), and tuber puts
#   { "class": "<class name>", "args": [] }
# onto the named tube when an entry falls due; Ingest::DispatchConsumer drains
# spool.maintenance and calls #perform on the named class. An entry deleted
# here is deleted from tuber at the next worker boot.
#
# Give exactly one of:
# every:    an interval aligned to the Unix epoch — "60s", "10m", "1h", "1d".
#           offset: shifts it ("5m").
# cron:     5-field cron, in UTC unless zone: names an IANA zone.
#
# Optional:
# idp:      tuber idempotency key — while a job with this key is in the tube
#           (ready, reserved or buried), further fires are suppressed. Use on
#           anything that can run longer than its own interval.
# con:      tuber concurrency key — caps simultaneous reserves across all
#           consumers for jobs sharing the key.
# catchup:  for ticks missed while tuber was down: once (the default) fires once
#           for the gap, never skips them, a number of seconds fires only if
#           that late at most.
# args:     passed to #perform. Defaults to [].
#
# See docs/queue.md.

# Poll the Fastmail JMAP folder for new support mail. idp: because a slow round
# trip must not stack a second poller behind the first — two pollers draining
# the same folder is how you get duplicate work (harmless, thanks to the unique
# index on messages.message_id, but pointless).
#
# A no-op unless SPOOL_JMAP_TOKEN is set, so this stays enabled in a checkout
# with no mail credentials.
jmap_poll:
  class: Jmap::PollJob
  tube: spool.maintenance
  every: 60s
  idp: jmap_poll

# Sweep OIDC session mappings whose expiry has passed. Cheap: one indexed
# delete over a table that holds at most a handful of rows.
cleanup_expired_oidc_sessions:
  class: CleanupExpiredOidcSessionsJob
  tube: spool.maintenance
  cron: "17 * * * *"
  con: 1
